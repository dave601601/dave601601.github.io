<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Reached only via the poster QR code; keep it out of search results -->
  <meta name="robots" content="noindex, nofollow" />
  <title>Demo Video</title>

  <!-- ============================================================
       EDIT HERE
       - title:   poster / project title
       - caption: one or two lines under the video
       - video:   either
                    • a YouTube link  ("https://youtu.be/XXXX"), or
                    • a video file next to this page ("demo.mp4")
                  Leave the placeholder text to show an empty video box.
       ============================================================ -->
  <script>
    const demo = {
      title: "Poster title goes here",
      caption: "Short caption for the demo video.",
      video: "PASTE_VIDEO_HERE",
    };
  </script>

  <style>
    :root {
      --bg: #ffffff;
      --fg: rgb(55, 53, 47);
      --muted: rgba(55, 53, 47, 0.65);
      --faint: rgba(55, 53, 47, 0.4);
      --accent: rgb(35, 131, 226);
      --divider: rgba(55, 53, 47, 0.09);
      --card-shadow: rgba(15, 15, 15, 0.1) 0px 0px 0px 1px,
        rgba(15, 15, 15, 0.1) 0px 2px 4px;
      --placeholder-bg: rgba(55, 53, 47, 0.03);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: rgb(25, 25, 25);
        --fg: rgba(255, 255, 255, 0.81);
        --muted: rgba(255, 255, 255, 0.46);
        --faint: rgba(255, 255, 255, 0.3);
        --accent: rgb(82, 156, 231);
        --divider: rgba(255, 255, 255, 0.13);
        --card-shadow: rgba(255, 255, 255, 0.094) 0px 0px 0px 1px,
          rgba(15, 15, 15, 0.3) 0px 2px 4px;
        --placeholder-bg: rgba(255, 255, 255, 0.03);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Helvetica, "Apple Color Emoji", Arial, sans-serif,
        "Segoe UI Emoji", "Segoe UI Symbol";
      background: var(--bg);
      color: var(--fg);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      max-width: 860px;
      margin: 0 auto;
      padding: 48px 40px 80px;
    }
    @media (max-width: 600px) {
      .wrap { padding: 28px 16px 60px; }
    }
    h1 {
      font-size: 1.9rem;
      font-weight: 700;
      margin: 0 0 20px;
      letter-spacing: -0.015em;
      line-height: 1.22;
    }
    @media (max-width: 600px) {
      h1 { font-size: 1.45rem; margin-bottom: 16px; }
    }

    /* Demo video (responsive 16:9) */
    .video {
      position: relative;
      padding-top: 56.25%;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      box-shadow: var(--card-shadow);
    }
    .video iframe, .video video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .video-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 16 / 9;
      border: 1px solid var(--divider);
      border-radius: 8px;
      color: var(--faint);
      background: var(--placeholder-bg);
      font-size: 0.9rem;
    }
    .caption { color: var(--muted); margin: 16px 0 0; font-size: 0.95rem; }
    .more {
      margin-top: 32px;
      padding-top: 18px;
      border-top: 1px solid var(--divider);
      font-size: 0.9rem;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="wrap" id="app"></div>

  <script>
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));
    }

    function youtubeEmbed(url) {
      const m = String(url).match(
        /(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]+)/
      );
      return m ? `https://www.youtube.com/embed/${m[1]}?playsinline=1&rel=0` : null;
    }

    function renderVideo(video) {
      if (!video || /PASTE_|_HERE/.test(video)) {
        return `<div class="video-placeholder">Demo video coming soon</div>`;
      }
      const yt = youtubeEmbed(video);
      if (yt) {
        return `<div class="video"><iframe src="${yt}" allowfullscreen
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe></div>`;
      }
      return `<div class="video"><video src="${escapeHtml(video)}" controls playsinline preload="metadata"></video></div>`;
    }

    document.title = demo.title;
    document.getElementById("app").innerHTML = `
      <h1>${escapeHtml(demo.title)}</h1>
      ${renderVideo(demo.video)}
      ${demo.caption ? `<p class="caption">${escapeHtml(demo.caption)}</p>` : ""}
      <div class="more"><a href="/">More projects →</a></div>
    `;
  </script>
</body>
</html>
